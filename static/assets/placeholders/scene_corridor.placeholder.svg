<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" style="background:#0c0c14">
  <!-- 走廊 placeholder：透视走廊 + 房门 + 画框 -->
  <defs>
    <radialGradient id="cg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a5a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#cg1)"/>
  <!-- 透视走廊 -->
  <polygon points="160,30 240,30 310,165 90,165" fill="#0e0e1a" stroke="#1e1e2e" stroke-width="1"/>
  <!-- 天花板线 -->
  <line x1="0" y1="0" x2="160" y2="30" stroke="#1a1a28" stroke-width="1"/>
  <line x1="400" y1="0" x2="240" y2="30" stroke="#1a1a28" stroke-width="1"/>
  <!-- 地板线 -->
  <line x1="90" y1="165" x2="310" y2="165" stroke="#2a2a3e" stroke-width="1"/>
  <line x1="0" y1="225" x2="90" y2="165" stroke="#1a1a28" stroke-width="1"/>
  <line x1="400" y1="225" x2="310" y2="165" stroke="#1a1a28" stroke-width="1"/>
  <!-- 左侧门 -->
  <rect x="30" y="80" width="40" height="70" fill="none" stroke="#2a2a3e" stroke-width="1" rx="1"/>
  <circle cx="65" cy="118" r="2" fill="#2a2a3e" opacity="0.5"/>
  <!-- 右侧门 -->
  <rect x="330" y="80" width="40" height="70" fill="none" stroke="#2a2a3e" stroke-width="1" rx="1"/>
  <circle cx="335" cy="118" r="2" fill="#2a2a3e" opacity="0.5"/>
  <!-- 尽头门 -->
  <rect x="170" y="55" width="60" height="70" fill="none" stroke="#2a2a3e" stroke-width="1.2" rx="1"/>
  <circle cx="222" cy="93" r="2.5" fill="#2a2a3e" opacity="0.5"/>
  <!-- 墙上画框 -->
  <rect x="110" y="50" width="30" height="22" fill="none" stroke="#2a2a3e" stroke-width="0.8" rx="1"/>
  <rect x="260" y="50" width="30" height="22" fill="none" stroke="#2a2a3e" stroke-width="0.8" rx="1"/>
  <!-- 吊灯 -->
  <line x1="200" y1="0" x2="200" y2="25" stroke="#2a2a3e" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="200" cy="30" rx="15" ry="5" fill="none" stroke="#2a2a3e" stroke-width="0.8" opacity="0.4"/>
  <!-- 标签 -->
  <text x="200" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4a4a6a" opacity="0.7" letter-spacing="2">走廊 · 真实图片待接入</text>
</svg>
