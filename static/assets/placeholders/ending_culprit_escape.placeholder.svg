<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" style="background:#080c10">
  <!-- 真凶逃脱结局：暴风雨 + 迷雾 + 消失的身影 -->
  <defs>
    <radialGradient id="ece1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a2a3a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#ece1)"/>
  <!-- 暴风雨线条 -->
  <line x1="50" y1="0" x2="80" y2="225" stroke="#1e3040" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="0" x2="130" y2="225" stroke="#1e3040" stroke-width="0.5" opacity="0.2"/>
  <line x1="300" y1="0" x2="270" y2="225" stroke="#1e3040" stroke-width="0.5" opacity="0.3"/>
  <line x1="350" y1="0" x2="320" y2="225" stroke="#1e3040" stroke-width="0.5" opacity="0.2"/>
  <!-- 消失的身影（淡化） -->
  <ellipse cx="200" cy="110" rx="30" ry="70" fill="#0a0e14" opacity="0.4"/>
  <ellipse cx="200" cy="50" rx="18" ry="22" fill="#0a0e14" opacity="0.3"/>
  <!-- 迷雾效果 -->
  <rect x="0" y="150" width="400" height="75" fill="#080c10" opacity="0.6"/>
  <!-- 问号 -->
  <text x="200" y="100" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1e2d42" opacity="0.5">?</text>
  <!-- 文字 -->
  <text x="200" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2a3a4a" opacity="0.5" letter-spacing="2">真凶逃脱</text>
</svg>
