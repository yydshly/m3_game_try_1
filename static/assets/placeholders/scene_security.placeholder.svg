<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" style="background:#080c10">
  <!-- 保安室 placeholder：监控屏幕 + 屏幕墙 + 桌椅 -->
  <defs>
    <radialGradient id="sg1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3a5a8b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#sg1)"/>
  <!-- 屏幕墙 -->
  <rect x="30" y="20" width="340" height="140" fill="#0a0e14" stroke="#1a2a3a" stroke-width="1.5" rx="2"/>
  <!-- 监控屏幕 grid -->
  <rect x="40" y="30" width="75" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="125" y="30" width="75" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="210" y="30" width="75" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="295" y="30" width="65" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="40" y="95" width="75" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="125" y="95" width="75" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="210" y="95" width="75" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <rect x="295" y="95" width="65" height="55" fill="#0a1018" stroke="#1a3040" stroke-width="0.8" rx="1"/>
  <!-- 屏幕内容线条（监控画面） -->
  <line x1="45" y1="35" x2="110" y2="35" stroke="#1a3040" stroke-width="0.5" opacity="0.5"/>
  <line x1="45" y1="40" x2="110" y2="40" stroke="#1a3040" stroke-width="0.5" opacity="0.5"/>
  <line x1="45" y1="45" x2="90" y2="45" stroke="#1a3040" stroke-width="0.5" opacity="0.5"/>
  <!-- 空白画面标识 -->
  <line x1="210" y1="30" x2="285" y2="150" stroke="#d94040" stroke-width="0.5" opacity="0.15"/>
  <line x1="285" y1="30" x2="210" y2="150" stroke="#d94040" stroke-width="0.5" opacity="0.15"/>
  <!-- 桌子 -->
  <rect x="130" y="175" width="140" height="30" fill="none" stroke="#1a2a3a" stroke-width="1.2" rx="2"/>
  <!-- 椅子暗示 -->
  <rect x="175" y="205" width="50" height="15" fill="#0a1018" stroke="#1a2a3a" stroke-width="0.8" rx="2" opacity="0.6"/>
  <!-- 控制台按钮 -->
  <circle cx="160" cy="190" r="3" fill="none" stroke="#2a4a6a" stroke-width="0.8" opacity="0.5"/>
  <circle cx="172" cy="190" r="3" fill="none" stroke="#2a4a6a" stroke-width="0.8" opacity="0.5"/>
  <circle cx="240" cy="190" r="3" fill="none" stroke="#2a4a6a" stroke-width="0.8" opacity="0.5"/>
  <!-- 标签 -->
  <text x="200" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a5a7a" opacity="0.7" letter-spacing="2">保安室 · 真实图片待接入</text>
</svg>
