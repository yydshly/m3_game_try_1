<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" style="background:#0f1520">
  <!-- 病历笔记：纸张 + 医学图标 + 记录线条 -->
  <defs>
    <radialGradient id="mn1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5da4c4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f1520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#mn1)"/>
  <!-- 纸张 -->
  <rect x="6" y="8" width="52" height="48" fill="#1a1f2e" stroke="#2a3a52" stroke-width="1" rx="1"/>
  <!-- 红十字 -->
  <rect x="27" y="12" width="10" height="3" fill="#c04040" opacity="0.4" rx="1"/>
  <rect x="30.5" y="10" width="3" height="7" fill="#c04040" opacity="0.4" rx="0.5"/>
  <!-- 文字线条 -->
  <line x1="12" y1="22" x2="52" y2="22" stroke="#3a4a5a" stroke-width="0.7" opacity="0.5"/>
  <line x1="12" y1="27" x2="48" y2="27" stroke="#3a4a5a" stroke-width="0.7" opacity="0.5"/>
  <line x1="12" y1="32" x2="50" y2="32" stroke="#3a4a5a" stroke-width="0.7" opacity="0.5"/>
  <line x1="12" y1="37" x2="44" y2="37" stroke="#3a4a5a" stroke-width="0.7" opacity="0.5"/>
  <line x1="12" y1="42" x2="46" y2="42" stroke="#3a4a5a" stroke-width="0.7" opacity="0.5"/>
  <line x1="12" y1="47" x2="40" y2="47" stroke="#3a4a5a" stroke-width="0.7" opacity="0.5"/>
  <!-- 医学术语暗示 -->
  <text x="32" y="56" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#5da4c4" opacity="0.4" letter-spacing="0.5">病历</text>
</svg>
