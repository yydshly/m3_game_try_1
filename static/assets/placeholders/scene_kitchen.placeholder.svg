<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" style="background:#0a1010">
  <!-- 厨房 placeholder：灶台 + 锅 + 料理台 -->
  <defs>
    <radialGradient id="kg1" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#4a7c59" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a1010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#kg1)"/>
  <!-- 地板 -->
  <rect x="0" y="165" width="400" height="60" fill="#121a14" opacity="0.9"/>
  <!-- 料理台 -->
  <rect x="30" y="100" width="340" height="65" fill="none" stroke="#2a3a2a" stroke-width="1.5" rx="2"/>
  <rect x="30" y="100" width="340" height="8" fill="#1a2a1a" opacity="0.5"/>
  <!-- 灶台 -->
  <rect x="50" y="70" width="120" height="30" fill="none" stroke="#3a4a3a" stroke-width="1" rx="2"/>
  <circle cx="80" cy="85" r="8" fill="none" stroke="#5a6a5a" stroke-width="0.8" opacity="0.5"/>
  <circle cx="120" cy="85" r="8" fill="none" stroke="#5a6a5a" stroke-width="0.8" opacity="0.5"/>
  <!-- 锅 -->
  <ellipse cx="85" cy="105" rx="22" ry="10" fill="#1a2a1a" stroke="#3a4a3a" stroke-width="1"/>
  <line x1="107" y1="98" x2="120" y2="85" stroke="#3a4a3a" stroke-width="1.5"/>
  <!-- 冰箱 -->
  <rect x="290" y="50" width="70" height="115" fill="none" stroke="#2a3a2a" stroke-width="1.5" rx="2"/>
  <line x1="290" y1="90" x2="360" y2="90" stroke="#2a3a2a" stroke-width="1"/>
  <rect x="350" y="65" width="4" height="15" fill="#2a3a2a" opacity="0.5" rx="1"/>
  <rect x="350" y="100" width="4" height="15" fill="#2a3a2a" opacity="0.5" rx="1"/>
  <!-- 挂钩/厨具 -->
  <line x1="200" y1="45" x2="260" y2="45" stroke="#2a3a2a" stroke-width="0.8"/>
  <line x1="215" y1="45" x2="215" y2="65" stroke="#2a3a2a" stroke-width="0.8" opacity="0.6"/>
  <line x1="230" y1="45" x2="230" y2="60" stroke="#2a3a2a" stroke-width="0.8" opacity="0.6"/>
  <line x1="245" y1="45" x2="245" y2="68" stroke="#2a3a2a" stroke-width="0.8" opacity="0.6"/>
  <!-- 标签 -->
  <text x="200" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4a6a5a" opacity="0.7" letter-spacing="2">厨房 · 真实图片待接入</text>
</svg>
