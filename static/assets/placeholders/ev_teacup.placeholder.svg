<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" style="background:#0f1520">
  <!-- 茶杯：杯体 + 茶水面 + 异常颜色 -->
  <defs>
    <radialGradient id="tc1" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#c04040" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c04040" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 杯体 -->
  <path d="M14 20 Q12 48 20 52 L44 52 Q52 48 50 20 Z" fill="none" stroke="#5a6a7e" stroke-width="1.2" rx="3"/>
  <!-- 茶杯内壁 -->
  <path d="M17 23 Q15 45 22 48 L42 48 Q49 45 47 23 Z" fill="url(#tc1)" opacity="0.6"/>
  <!-- 茶水液面 -->
  <ellipse cx="32" cy="26" rx="15" ry="4" fill="none" stroke="#c04040" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="32" cy="26" rx="15" ry="4" fill="#c04040" opacity="0.08"/>
  <!-- 异常残留物 -->
  <circle cx="28" cy="25" r="1.5" fill="#c04040" opacity="0.3"/>
  <circle cx="35" cy="26" r="1" fill="#c04040" opacity="0.25"/>
  <!-- 杯把 -->
  <path d="M50 25 Q58 25 58 34 Q58 43 50 43" fill="none" stroke="#5a6a7e" stroke-width="1.2"/>
  <!-- 底座 -->
  <ellipse cx="32" cy="53" rx="14" ry="3" fill="none" stroke="#5a6a7e" stroke-width="1" opacity="0.6"/>
  <!-- 警示标记 -->
  <text x="32" y="62" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#c04040" opacity="0.5" letter-spacing="1">异常</text>
</svg>
