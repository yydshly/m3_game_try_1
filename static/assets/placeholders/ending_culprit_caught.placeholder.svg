<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" style="background:#0c1018">
  <!-- 真凶落网结局：黎明光线 + 揭露时刻 -->
  <defs>
    <radialGradient id="eca1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c1018" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#eca1)"/>
  <!-- 渐亮天空（黎明） -->
  <rect x="0" y="0" width="400" height="100" fill="#1a1f2e" opacity="0.5"/>
  <!-- 地平线光 -->
  <rect x="0" y="90" width="400" height="10" fill="#c9a227" opacity="0.08"/>
  <!-- 人物剪影（林婉被揭露） -->
  <ellipse cx="200" cy="130" rx="40" ry="80" fill="#1a1f2e" stroke="#2a3040" stroke-width="1"/>
  <ellipse cx="200" cy="60" rx="20" ry="24" fill="#1a1f2e" stroke="#2a3040" stroke-width="1"/>
  <!-- 真相之光（手电/聚光灯效果） -->
  <polygon points="150,30 120,200 280,200 250,30" fill="#c9a227" opacity="0.04"/>
  <!-- 文字 -->
  <text x="200" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#c9a227" opacity="0.5" letter-spacing="2">真凶落网</text>
</svg>
