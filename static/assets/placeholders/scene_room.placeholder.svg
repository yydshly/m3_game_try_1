<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" style="background:#0c0e14">
  <!-- 通用房间 placeholder：床 + 桌子 + 窗户 -->
  <defs>
    <radialGradient id="rg1" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3a3a5a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c0e14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#rg1)"/>
  <!-- 地板 -->
  <rect x="0" y="155" width="400" height="70" fill="#111218" opacity="0.8"/>
  <line x1="0" y1="155" x2="400" y2="155" stroke="#1a1a28" stroke-width="1"/>
  <!-- 床 -->
  <rect x="40" y="110" width="140" height="50" fill="none" stroke="#2a2a3e" stroke-width="1.5" rx="3"/>
  <rect x="40" y="105" width="140" height="10" fill="#1a1a28" stroke="#2a2a3e" stroke-width="1" rx="2" opacity="0.7"/>
  <rect x="45" y="115" width="130" height="35" fill="#141420" opacity="0.5"/>
  <!-- 枕头 -->
  <ellipse cx="80" cy="115" rx="20" ry="8" fill="#1a1a28" opacity="0.6"/>
  <!-- 床头柜 -->
  <rect x="190" y="120" width="30" height="35" fill="none" stroke="#2a2a3e" stroke-width="1" rx="1"/>
  <circle cx="205" cy="138" r="2" fill="#2a2a3e" opacity="0.4"/>
  <!-- 窗户 -->
  <rect x="260" y="50" width="80" height="90" fill="none" stroke="#1e2030" stroke-width="1.5" rx="2"/>
  <line x1="300" y1="50" x2="300" y2="140" stroke="#1e2030" stroke-width="0.8"/>
  <line x1="260" y1="95" x2="340" y2="95" stroke="#1e2030" stroke-width="0.8"/>
  <!-- 桌子/梳妆台 -->
  <rect x="270" y="155" width="100" height="35" fill="none" stroke="#2a2a3e" stroke-width="1.2" rx="2"/>
  <!-- 镜子 -->
  <ellipse cx="320" cy="150" rx="18" ry="22" fill="none" stroke="#2a2a3e" stroke-width="1" opacity="0.5"/>
  <!-- 标签 -->
  <text x="200" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4a4a6a" opacity="0.7" letter-spacing="2">房间 · 真实图片待接入</text>
</svg>
