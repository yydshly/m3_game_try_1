<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孤岛晚宴</title>
<style>
:root {
  --bg: #080c14;
  --surface: #0f1520;
  --surface2: #161e2e;
  --surface3: #1c2638;
  --border: #1e2d42;
  --border2: #2a3a52;
  --gold: #c9a227;
  --gold-dim: #7a6115;
  --gold-glow: rgba(201,162,39,0.15);
  --text: #d4dce8;
  --muted: #5a6a7e;
  --narrator: #5da4c4;
  --system: #8b6fdb;
  --danger: #d94040;
  --success: #3da84f;
  --chenbo: #c8963a;
  --linwan: #c04040;
  --susu: #c05090;
  --wangzong: #5090d0;
  --afu: #40a060;
  --xiaozhang: #d08030;
  --study-bg: rgba(184,115,51,0.06);
  --kitchen-bg: rgba(74,124,89,0.06);
  --dining-bg: rgba(139,58,58,0.06);
  --security-bg: rgba(58,90,139,0.06);
  --corridor-bg: rgba(90,90,110,0.05);
  --room-bg: rgba(80,80,100,0.05);
  --hall-bg: rgba(201,162,39,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ─────────────────────────────── */
header {
  background: rgba(10,14,22,0.98);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 20;
  position: relative;
}

.hd-title {
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(201,162,39,0.25);
}

.hd-meta {
  display: flex;
  align-items: center;
  gap: 14px;
}

.hm-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.hm-label { font-size: 10px; letter-spacing: 1px; }
.hm-value { color: var(--text); font-weight: 500; }

.phase-badge {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 3px 10px;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 1.5px;
}

.phase-badge.confrontation { border-color: rgba(217,64,64,0.4); color: var(--danger); }

.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.conn-dot.live { background: var(--success); box-shadow: 0 0 6px var(--success); }

/* ── TIMELINE BAR ────────────────────── */
.timeline-bar {
  background: rgba(10,14,22,0.92);
  border-bottom: 1px solid var(--border);
  padding: 6px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.tl-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; white-space: nowrap; }

.tl-clock {
  display: flex;
  align-items: center;
  gap: 4px;
}

.tl-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid var(--border2);
  background: transparent;
  transition: all 0.3s;
}
.tl-dot.passed { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 5px rgba(201,162,39,0.4); }
.tl-dot.current { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 6px rgba(217,64,64,0.5); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.tl-phase-track { display: flex; gap: 8px; align-items: center; }
.tl-phase-badge {
  font-size: 9.5px;
  padding: 2px 8px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  color: var(--muted);
  background: var(--surface);
  letter-spacing: 0.5px;
  transition: all 0.2s;
}
.tl-phase-badge.active { border-color: var(--gold); color: var(--gold); background: rgba(201,162,39,0.08); }
.tl-phase-badge.done { opacity: 0.5; }

.tl-events { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; }

/* ── MAIN LAYOUT ────────────────────── */
.game-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT: SCENE STAGE ────────────── */
.scene-stage {
  width: 430px;
  min-width: 380px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.4s;
  position: relative;
}

.scene-stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(8,12,20,0.18) 0%, rgba(8,12,20,0.38) 52%, rgba(8,12,20,0.62) 100%);
  z-index: 0;
  pointer-events: none;
}

.scene-stage::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top center, rgba(201,162,39,0.06) 0%, transparent 42%);
  z-index: 0;
  pointer-events: none;
}

.scene-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  opacity: 0.46;
  filter: brightness(0.86) saturate(0.92) contrast(1.05);
  z-index: 0;
  pointer-events: none;
}

.scene-stage[data-theme="kitchen"] .scene-bg-img,
.scene-stage[data-theme="dining"] .scene-bg-img,
.scene-stage[data-theme="security"] .scene-bg-img,
.scene-stage[data-theme="corridor"] .scene-bg-img {
  opacity: 0.54;
  filter: brightness(0.92) saturate(0.95) contrast(1.04);
}

.scene-loc-card, .scene-divider, .npc-list {
  position: relative;
  z-index: 3;
}

[data-theme="hall"]    { background: linear-gradient(160deg, rgba(201,162,39,0.08) 0%, var(--surface) 50%); }
[data-theme="study"]   { background: linear-gradient(160deg, rgba(184,115,51,0.10) 0%, var(--surface) 50%); }
[data-theme="kitchen"] { background: linear-gradient(160deg, rgba(74,124,89,0.10) 0%, var(--surface) 50%); }
[data-theme="dining"]  { background: linear-gradient(160deg, rgba(139,58,58,0.10) 0%, var(--surface) 50%); }
[data-theme="security"] { background: linear-gradient(160deg, rgba(58,90,139,0.10) 0%, var(--surface) 50%); }
[data-theme="corridor"] { background: linear-gradient(160deg, rgba(90,90,110,0.08) 0%, var(--surface) 50%); }
[data-theme="room"]    { background: linear-gradient(160deg, rgba(80,80,100,0.08) 0%, var(--surface) 50%); }

.scene-loc-card {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.scene-loc-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
  background: var(--loc-color, var(--gold));
  opacity: 0.6;
}

.loc-name {
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 5px;
}
.loc-mood {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
}

.scene-divider {
  padding: 6px 14px;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
  background: rgba(8,12,20,0.72);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: auto;
}

.npc-list {
  flex: 0 0 auto;
  max-height: 230px;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: linear-gradient(180deg, rgba(8,12,20,0.72) 0%, rgba(8,12,20,0.92) 100%);
  backdrop-filter: blur(10px);
}

.stage-character-layer {
  position: absolute;
  left: 0;
  right: 0;
  top: 64px;
  bottom: 236px;
  z-index: 2;
  pointer-events: none;
}

.stage-character {
  position: absolute;
  bottom: 0;
  width: 37%;
  max-width: 188px;
  min-width: 120px;
  height: 74%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  pointer-events: auto;
  border: none;
  background: none;
  padding: 0;
  transition: transform 0.25s ease, filter 0.25s ease, opacity 0.25s ease;
}

.stage-character:hover {
  transform: translateY(-4px);
}

.stage-character.left { left: 4%; }
.stage-character.center {
  left: 50%;
  transform: translateX(-50%);
  width: 45%;
  max-width: 226px;
  height: 79%;
  z-index: 2;
}
.stage-character.center:hover {
  transform: translateX(-50%) translateY(-4px);
}
.stage-character.right { right: 4%; }
.stage-character.solo {
  left: 50%;
  transform: translateX(-50%);
  width: 48%;
  max-width: 234px;
  height: 79%;
}
.stage-character.solo:hover {
  transform: translateX(-50%) translateY(-4px);
}
.stage-character.duo-left { left: 11%; width: 44%; max-width: 205px; height: 77%; }
.stage-character.duo-right { right: 11%; width: 44%; max-width: 205px; height: 77%; }

.stage-character.active {
  filter: drop-shadow(0 0 18px rgba(201,162,39,0.35));
}

.stage-character.active .stage-character-art {
  border-color: rgba(201,162,39,0.45);
  background: linear-gradient(180deg, rgba(201,162,39,0.09) 0%, rgba(201,162,39,0.02) 100%);
}

.stage-character.placeholder .stage-character-art img {
  opacity: 0.72;
  filter: saturate(0.55) brightness(0.92);
}

.stage-character-art {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
  filter: drop-shadow(0 14px 26px rgba(0,0,0,0.4));
}

.stage-character-art img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}

.stage-character-fallback {
  width: 100%;
  height: 100%;
  border-radius: 16px 16px 10px 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 600;
}

.stage-character-label {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(8,12,20,0.72);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text);
  font-size: 10px;
  letter-spacing: 1px;
  white-space: nowrap;
  backdrop-filter: blur(8px);
}

.stage-character.active .stage-character-label {
  color: var(--gold);
  border-color: rgba(201,162,39,0.26);
}

.stage-empty {
  position: absolute;
  inset: auto 16px 18px 16px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(8,12,20,0.44);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  text-align: center;
  backdrop-filter: blur(8px);
}

/* NPC CARD */
.npc-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.npc-card.here {
  border-color: rgba(201,162,39,0.4);
  background: rgba(201,162,39,0.07);
}
.npc-card.here::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--gold);
}
.npc-card.talked { border-color: rgba(93,164,196,0.3); }
.npc-card.absent { opacity: 0.45; }

.npc-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 5px;
}

.npc-avatar {
  width: 46px; height: 58px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: bold;
  flex-shrink: 0;
  border: 1px solid;
  overflow: hidden;
  background: rgba(255,255,255,0.03);
}

.npc-avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}

.npc-info { flex: 1; min-width: 0; }
.npc-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npc-role { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

.npc-badges { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.badge-here {
  font-size: 8.5px; background: rgba(201,162,39,0.15); color: var(--gold);
  border: 1px solid rgba(201,162,39,0.3); border-radius: 3px; padding: 1px 4px; letter-spacing: 0.3px;
}
.badge-talked {
  font-size: 8.5px; background: rgba(93,164,196,0.1); color: var(--narrator);
  border: 1px solid rgba(93,164,196,0.25); border-radius: 3px; padding: 1px 4px;
}
.badge-dead {
  font-size: 8.5px; background: rgba(217,64,64,0.1); color: var(--danger);
  border: 1px solid rgba(217,64,64,0.25); border-radius: 3px; padding: 1px 4px;
}

.npc-absent-loc { font-size: 9.5px; color: var(--muted); margin-top: 3px; }

/* suspicion bar */
.npc-suspicion { margin-top: 5px; }
.suspicion-label { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-bottom: 2px; }
.suspicion-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.suspicion-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

.npc-talk-btn {
  width: 100%; margin-top: 7px;
  background: rgba(201,162,39,0.08);
  border: 1px solid rgba(201,162,39,0.25);
  border-radius: 5px;
  color: var(--gold);
  font-size: 11px; padding: 5px 8px;
  cursor: pointer; font-family: inherit; letter-spacing: 0.5px;
  transition: all 0.15s;
}
.npc-talk-btn:hover:not(:disabled) { background: rgba(201,162,39,0.16); border-color: var(--gold); }
.npc-talk-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── CENTER: STORY LOG ─────────────── */
.story-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.story-log {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px 80px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.entry-narrator {
  margin: 10px 0;
  padding: 10px 14px 10px 16px;
  color: var(--narrator);
  font-size: 12.5px;
  line-height: 1.9;
  border-left: 2px solid rgba(93,164,196,0.45);
  background: rgba(93,164,196,0.05);
  border-radius: 0 6px 6px 0;
  font-style: italic;
}

.entry-system {
  color: var(--system);
  font-size: 11px;
  padding: 3px 2px 3px 10px;
  border-left: 2px solid rgba(139,111,219,0.3);
  margin: 3px 0;
  opacity: 0.85;
}

.entry-investigate {
  background: rgba(93,164,196,0.07);
  border: 1px solid rgba(93,164,196,0.2);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--narrator);
  margin: 4px 0;
}

.entry-clock {
  text-align: center;
  color: var(--gold);
  font-size: 10.5px;
  letter-spacing: 2px;
  padding: 5px 0;
  opacity: 0.65;
}

.entry-gameover {
  background: rgba(201,162,39,0.07);
  border: 1px solid rgba(201,162,39,0.28);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  margin: 8px 0;
}
.go-verdict { color: var(--gold); font-size: 13px; letter-spacing: 3px; margin-bottom: 8px; }
.go-summary { color: var(--muted); font-size: 11.5px; line-height: 1.8; text-align: left; white-space: pre-wrap; }

/* dialogue */
.entry-dialogue { display: flex; gap: 10px; margin: 5px 0; align-items: flex-start; }
.entry-dialogue.player { flex-direction: row-reverse; }
.avatar {
  width: 40px;
  height: 52px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
  border: 1px solid;
  overflow: hidden;
  background: rgba(255,255,255,0.03);
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}
.bubble { max-width: 64%; padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.7; }
.entry-dialogue:not(.player) .bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 2px 12px 12px 12px; }
.entry-dialogue.player .bubble { background: rgba(201,162,39,0.09); border: 1px solid rgba(201,162,39,0.2); border-radius: 12px 2px 12px 12px; }
.speaker-name { font-size: 10px; color: var(--muted); margin-bottom: 3px; letter-spacing: 1px; }
.player-label { color: var(--gold) !important; }
.typing-cursor { display: inline-block; width: 2px; height: 13px; background: var(--gold); vertical-align: middle; animation: blink 0.7s step-end infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── RIGHT SIDEBAR ──────────────── */
.right-sidebar {
  width: 244px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section { border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-section.flexible { flex: 1; overflow: hidden; }

.sidebar-title {
  padding: 7px 13px;
  background: rgba(201,162,39,0.06);
  color: var(--gold);
  font-size: 9px;
  letter-spacing: 2px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-body { padding: 10px 13px; flex: 1; overflow-y: auto; }

.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 11.5px; }
.stat-label { color: var(--muted); }
.stat-value { color: var(--text); font-weight: 500; }

/* evidence cards */
.evidence-cards { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.ev-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.15s;
}
.ev-card:hover { border-color: rgba(93,164,196,0.4); }
.ev-icon {
  width: 40px;
  height: 40px;
  font-size: 16px;
  flex-shrink: 0;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
}
.ev-icon-img {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  line-height: 1;
  object-fit: contain;
  display: block;
}
.ev-info { flex: 1; min-width: 0; }
.ev-name { font-size: 11.5px; color: var(--text); font-weight: 500; }
.ev-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.ev-level {
  font-size: 9px; padding: 1px 5px; border-radius: 3px;
  border: 1px solid;
}
.ev-level.critical { color: var(--danger); border-color: rgba(217,64,64,0.3); background: rgba(217,64,64,0.08); }
.ev-level.important { color: var(--gold); border-color: rgba(201,162,39,0.3); background: rgba(201,162,39,0.08); }
.ev-level.normal { color: var(--muted); border-color: var(--border); background: transparent; }
.ev-empty { font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.7; }

/* events */
.event-list { display: flex; flex-direction: column; gap: 4px; }
.event-item { font-size: 10.5px; color: var(--muted); padding: 3px 0; border-bottom: 1px solid rgba(30,45,66,0.6); line-height: 1.5; }
.event-item:last-child { border-bottom: none; }
.ev-empty-small { font-size: 10.5px; color: var(--muted); font-style: italic; }

/* ── ACTION BAR ─────────────────── */
.action-bar {
  background: rgba(10,14,22,0.97);
  border-top: 1px solid var(--border);
  padding: 9px 18px 11px;
  flex-shrink: 0;
  z-index: 10;
}

.action-groups { display: flex; flex-direction: column; gap: 5px; }
.action-group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.action-group-label { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; margin-right: 2px; white-space: nowrap; min-width: 28px; }

.action-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 13px;
  font-size: 11.5px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.action-btn:hover:not(:disabled) {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(201,162,39,0.08);
  box-shadow: 0 0 8px rgba(201,162,39,0.1);
}
.action-btn:disabled, .action-btn.disabled { opacity: 0.3; cursor: not-allowed; }
.action-btn.loading { opacity: 0.6; cursor: wait; }

/* ── TALK MODAL ─────────────────── */
#talk-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8,12,20,0.85);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#talk-overlay.show { display: flex; }
.talk-card {
  background: var(--surface);
  border: 1px solid rgba(201,162,39,0.3);
  border-radius: 10px;
  padding: 28px 30px;
  width: 400px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.65), 0 0 40px rgba(201,162,39,0.04);
}
.talk-avatar {
  width: 64px; height: 84px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: bold; margin: 0 auto 8px; border: 1px solid;
  overflow: hidden;
  background: rgba(255,255,255,0.03);
}
.talk-avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}
.talk-title { text-align: center; color: var(--gold); font-size: 13.5px; letter-spacing: 3px; margin-bottom: 4px; }
.talk-role { text-align: center; color: var(--muted); font-size: 10.5px; margin-bottom: 16px; }
.preset-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
.preset-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.preset-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
#talk-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 12.5px; padding: 9px 12px; font-family: inherit; outline: none;
  resize: none; box-sizing: border-box; line-height: 1.6;
}
#talk-input:focus { border-color: var(--gold-dim); }
.talk-btns { display: flex; gap: 8px; margin-top: 11px; }
.talk-btns button { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: bold; letter-spacing: 1px; transition: background 0.2s; }
#talk-send { background: var(--gold-dim); color: var(--bg); }
#talk-send:hover { background: var(--gold); }
#talk-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
#talk-cancel:hover { border-color: var(--muted); color: var(--text); }

/* ── ONBOARDING ─────────────────── */
#onboarding {
  position: fixed; inset: 0;
  background: rgba(8,12,20,0.96);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
}
#onboarding .card {
  background: var(--surface); border: 1px solid rgba(201,162,39,0.22);
  border-radius: 12px; padding: 40px 46px; max-width: 450px; text-align: center;
  box-shadow: 0 0 80px rgba(201,162,39,0.05);
}
#onboarding h2 { color: var(--gold); font-size: 20px; font-weight: 400; letter-spacing: 8px; margin-bottom: 16px; text-shadow: 0 0 30px rgba(201,162,39,0.2); }
#onboarding p { color: var(--muted); font-size: 12.5px; line-height: 1.9; margin-bottom: 22px; }
#onboarding .hint {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 18px; text-align: left; margin-bottom: 22px; font-size: 12px; line-height: 2; color: var(--muted);
}
#onboarding .hint span { color: var(--gold); font-family: monospace; }
#onboarding button {
  background: var(--gold-dim); color: var(--bg); border: none; border-radius: 6px;
  padding: 11px 36px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: bold;
  letter-spacing: 3px; transition: background 0.2s;
}
#onboarding button:hover { background: var(--gold); }

/* ── GAME OVER ─────────────────── */
#gameover { display: none; position: fixed; inset: 0; background: rgba(8,12,20,0.93); align-items: center; justify-content: center; z-index: 300; }
#gameover.show { display: flex; }
#gameover .card {
  background: var(--surface); border: 1px solid var(--gold-dim); border-radius: 12px;
  padding: 38px 40px; max-width: 520px; width: 90%; text-align: center;
  box-shadow: 0 0 60px rgba(201,162,39,0.07);
}
#gameover h2 { color: var(--gold); font-size: 17px; letter-spacing: 4px; margin-bottom: 12px; }
#gameover .verdict { font-size: 10.5px; color: var(--muted); letter-spacing: 2px; margin-bottom: 18px; }
#gameover .summary { color: var(--text); font-size: 12.5px; line-height: 1.9; margin-bottom: 24px; white-space: pre-wrap; text-align: left; }
#gameover button { background: var(--gold-dim); color: var(--bg); border: none; border-radius: 6px; padding: 10px 32px; font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: bold; letter-spacing: 2px; transition: background 0.2s; }
#gameover button:hover { background: var(--gold); }

/* ── SCENE FLASH ───────────────── */
#scene-flash { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
#scene-flash.active { opacity: 1; pointer-events: all; }
#scene-flash .flash-text { color: var(--gold); font-size: 15px; letter-spacing: 4px; opacity: 0; transition: opacity 0.3s 0.15s; }
#scene-flash.active .flash-text { opacity: 1; }
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════
// 视觉资产管线 / Asset Pipeline
// ═══════════════════════════════════════════════
let assetManifest = null;

async function loadAssetManifest() {
  try {
    const r = await fetch('/static/assets/manifest.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    assetManifest = await r.json();
    console.log('[Asset] manifest loaded, asset_mode:', assetManifest.asset_mode);
    return assetManifest;
  } catch(e) {
    console.warn('[Asset] manifest load failed, using fallback:', e.message);
    return null;
  }
}

function resolveSceneAsset(locationName) {
  if (!assetManifest || !assetManifest.scenes) return null;
  const scene = assetManifest.scenes[locationName];
  if (!scene) return null;
  return {
    image: scene.image,
    placeholder: scene.placeholder,
    title: scene.title,
    description: scene.description,
  };
}

function resolveCharacterAsset(npcName) {
  if (!assetManifest || !assetManifest.characters) return null;
  const ch = assetManifest.characters[npcName];
  if (!ch) return null;
  return {
    portrait: ch.portrait,
    placeholder: ch.placeholder,
    position: ch.position,
    color: ch.color,
    letter: ch.letter,
  };
}

function resolveEvidenceAsset(evidenceName) {
  if (!assetManifest || !assetManifest.evidence) return null;
  const ev = assetManifest.evidence[evidenceName];
  if (!ev) return null;
  return {
    icon: ev.icon,
    placeholder: ev.placeholder,
    title: ev.title,
    source: ev.source,
    points_to: ev.points_to,
  };
}

function setImageWithFallback(img, primary, fallback, onError) {
  if (!primary) { if (fallback) img.src = fallback; return; }
  img.src = primary;
  img.onerror = () => {
    if (fallback) {
      img.src = fallback;
      img.onerror = null;
    } else if (onError) {
      onError();
    }
  };
}

function stageSlotClass(index, count) {
  if (count <= 1) return 'solo';
  if (count === 2) return index === 0 ? 'duo-left' : 'duo-right';
  return ['left', 'center', 'right'][index] || 'right';
}

function buildPresentStageNpcs(npcs, location) {
  const direct = (npcs || []).filter(npc => npc && npc.present === true && npc.alive !== false);
  if (direct.length) return direct.slice(0, 3);

  const names = location?.present_npcs || [];
  return names.slice(0, 3).map(name => ({
    name,
    public_role: NPC[name]?.role || '',
    present: true,
    alive: true,
    talked: false,
  }));
}

function mountStageCharacterArt(wrapper, npc, charAsset, meta) {
  const portrait = charAsset?.portrait;
  const placeholder = charAsset?.placeholder;
  const fallbackLetter = charAsset?.letter || meta.letter || npc.name[0];
  const art = document.createElement('div');
  art.className = 'stage-character-art';

  function showTextFallback() {
    art.innerHTML = `<div class="stage-character-fallback">${fallbackLetter}</div>`;
  }

  if (portrait || placeholder) {
    const img = document.createElement('img');
    img.alt = npc.name;
    img.src = portrait || placeholder;
    if (!portrait && placeholder) wrapper.classList.add('placeholder');
    img.onerror = () => {
      if (placeholder && img.src !== new URL(placeholder, location.origin).href) {
        img.src = placeholder;
        wrapper.classList.add('placeholder');
        img.onerror = showTextFallback;
      } else {
        showTextFallback();
      }
    };
    art.appendChild(img);
  } else {
    showTextFallback();
  }

  return art;
}

// ── NPC 角色配置 ───────────────────────────────
const NPC = {
  '陈伯':  { cls:'chenbo',   color:'var(--chenbo)',   letter:'伯', role:'老管家',    archetype:'忠诚谨慎' },
  '林婉':  { cls:'linwan',   color:'var(--linwan)',   letter:'婉', role:'私人医生',  archetype:'冷静专业' },
  '苏苏':  { cls:'susu',     color:'var(--susu)',     letter:'苏', role:'侄女',      archetype:'情绪不稳' },
  '王总':  { cls:'wangzong', color:'var(--wangzong)', letter:'王', role:'商业伙伴',  archetype:'强势精明' },
  '阿福':  { cls:'afu',      color:'var(--afu)',      letter:'福', role:'厨师',      archetype:'老实紧张' },
  '小张':  { cls:'xiaozhang',color:'var(--xiaozhang)',letter:'张', role:'保安',      archetype:'年轻心虚' },
};

const PRESETS = {
  '陈伯': ['你昨晚在哪？','茶杯的事你知道吗？','新遗嘱是怎么回事？','周老爷有什么仇家吗？'],
  '林婉': ['你和周老爷是什么关系？','你给他开了什么药？','你昨晚几点睡的？','你知道新遗嘱的事吗？'],
  '苏苏': ['你为什么来岛上？','你和周老爷吵过架吗？','昨晚你听到了什么？','你知道遗产的事吗？'],
  '王总': ['你欠周老爷多少钱？','借据在哪？','你昨晚去了哪里？','你和林婉什么关系？'],
  '阿福': ['你昨晚看到了什么？','有人进过书房吗？','厨房有什么异常吗？','你知道谁下的毒吗？'],
  '小张': ['你昨晚巡逻了吗？','监控为什么有空白？','有人进出过书房吗？','你听到了什么动静？'],
};

const PHASE_NAME = { dinner:'晚宴', investigation:'调查', confrontation:'对峙', ending:'结局' };
const CLOCK_NAMES = ['深夜 0:00','凌晨 1:00','凌晨 2:00','凌晨 3:00','凌晨 4:00','凌晨 5:00','清晨 6:00','清晨 7:00','早晨 8:00'];

// ── 状态 ───────────────────────────────────────
let sessionId = null, es = null, gameEnded = false, currentNpc = null, actionLoading = false;
let latestNpcs = [], latestLocation = null;

// ── 初始化 ─────────────────────────────────────
function startGame() {
  document.getElementById('onboarding').style.display = 'none';
  initGame();
}

async function initGame() {
  try {
    // Load asset manifest before connecting to game
    await loadAssetManifest();
    const r = await fetch('/api/session', {method:'POST'});
    const d = await r.json();
    sessionId = d.session_id;
    updateState(d.state);
    connectSSE(sessionId);
    document.getElementById('connDot').classList.add('live');
  } catch(e) { log('entry-system', '连接服务器失败: ' + e.message); }
}

// ── SSE ─────────────────────────────────────────
function connectSSE(sid) {
  if (es) es.close();
  es = new EventSource(`/api/stream/${sid}`);
  es.addEventListener('connected', () => document.getElementById('connDot').classList.add('live'));
  es.addEventListener('narrator', e => streamNarrator(JSON.parse(e.data)));
  es.addEventListener('npc_reply', e => streamNPCReply(JSON.parse(e.data)));
  es.addEventListener('system', e => handleSystem(JSON.parse(e.data)));
  es.addEventListener('game_over', e => showGameOver(JSON.parse(e.data)));
  es.addEventListener('heartbeat', () => {});
  es.onerror = () => document.getElementById('connDot').classList.remove('live');
}

// ── 渲染 ───────────────────────────────────────
function streamNarrator(chunks) {
  const el = document.createElement('div'); el.className = 'entry-narrator';
  document.getElementById('story-log').appendChild(el);
  streamText(el, chunks);
}

function streamNPCReply(data) {
  const npc = data.npc, meta = NPC[npc] || {};
  const charAsset = resolveCharacterAsset(npc);
  const color = charAsset?.color || meta.color || 'var(--muted)';
  const letter = charAsset?.letter || meta.letter || npc[0];

  const w = document.createElement('div'); w.className = 'entry-dialogue';
  const avatarEl = document.createElement('div');
  avatarEl.className = 'avatar';
  avatarEl.style.cssText = `background:${color}18;color:${color};border-color:${color}44`;

  if (charAsset?.portrait) {
    const img = document.createElement('img');
    img.style.cssText = 'width:33px;height:33px;border-radius:50%;object-fit:cover;';
    img.alt = npc;
    const ph = charAsset.placeholder;
    setImageWithFallback(img, charAsset.portrait, ph);
    avatarEl.textContent = '';
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = letter;
  }

  w.innerHTML = `<div class="bubble"><div class="speaker-name">${npc}</div></div>`;
  w.insertBefore(avatarEl, w.firstChild);
  document.getElementById('story-log').appendChild(w);
  streamText(w.querySelector('.bubble'), data.text);
  scroll();
}

function streamText(el, chunks) {
  let i = 0;
  const cur = document.createElement('span'); cur.className = 'typing-cursor'; el.appendChild(cur);
  function next() {
    if (i < chunks.length) {
      el.insertBefore(document.createTextNode(chunks[i]), cur); i++; scroll();
      setTimeout(next, 52 + Math.random() * 48);
    } else { cur.remove(); }
  }
  next();
}

function handleSystem(data) {
  if (data.type === 'game_over') { showGameOver(data); return; }
  if (data.type === 'clock') { log('entry-clock', '─── ' + data.text + ' ───'); return; }
  if (data.type === 'location') { showFlash(data.text.split('\n')[0]); return; }
  const cls = ['phase-hint','npc_action','npc_decision','linwan_alert','accusation','boat_arrived'].includes(data.type)
    ? 'entry-system phase-hint' : 'entry-system';
  log(cls, data.text || JSON.stringify(data));
}

function log(cls, text) {
  const el = document.createElement('div'); el.className = cls; el.textContent = text;
  document.getElementById('story-log').appendChild(el); scroll();
}

function showFlash(text) {
  const f = document.getElementById('scene-flash');
  document.getElementById('flash-text').textContent = text;
  f.classList.add('active');
  setTimeout(() => f.classList.remove('active'), 1200);
}

function showGameOver(d) {
  document.getElementById('go-verdict').textContent = d.verdict || '';
  const full = (d.summary||'') + '\n\n真凶: ' + (d.culprit||'?') +
    (d.innocent&&d.innocent.length ? '\n无辜: ' + d.innocent.join('、') : '');
  document.getElementById('go-summary').textContent = '';
  document.getElementById('gameover').classList.add('show');
  gameEnded = true;
  streamText(document.getElementById('go-summary'), [full]);
}

function restartGame() {
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('story-log').innerHTML = '';
  gameEnded = false;
  if (es) { es.close(); es = null; }
  initGame();
}

// ── 状态同步 ────────────────────────────────────
function updateState(s) {
  if (!s) return;

  // header
  document.getElementById('h-clock').textContent = s.clock_name || '—';
  document.getElementById('h-phase').textContent = PHASE_NAME[s.phase] || s.phase || '—';
  document.getElementById('h-location').textContent = s.player_location || '—';
  document.getElementById('h-evcount').textContent = (s.inventory||[]).length;
  document.getElementById('h-talked').textContent = (s.talked_npcs||[]).length;

  const phaseBadge = document.getElementById('h-phase');
  phaseBadge.className = 'phase-badge' + (s.phase === 'confrontation' ? ' confrontation' : '');

  // sidebar
  document.getElementById('s-clock').textContent = s.clock_name || '—';
  document.getElementById('s-phase').textContent = PHASE_NAME[s.phase] || s.phase || '—';
  document.getElementById('s-location').textContent = s.player_location || '—';

  // evidence cards
  renderEvidence(s.evidence_details || []);

  // public events
  const evts = s.public_events || [];
  document.getElementById('s-events').innerHTML = evts.length
    ? '<div class="event-list">' + evts.map(e => `<div class="event-item">${e}</div>`).join('') + '</div>'
    : '<div class="ev-empty-small">暂无公共事件</div>';

  // scene stage
  if (s.current_location) {
    const loc = s.current_location;
    const stage = document.getElementById('scene-stage');
    stage.setAttribute('data-theme', loc.theme || 'room');
    document.getElementById('sc-loc-name').textContent = loc.name || '—';
    document.getElementById('sc-loc-mood').textContent = loc.mood || '';
    const card = stage.querySelector('.scene-loc-card');
    if (card) card.style.setProperty('--loc-color', loc.color || 'var(--gold)');

    // Load scene background image from manifest
    const bgImg = document.getElementById('scene-bg-img');
    const sceneAsset = resolveSceneAsset(loc.name);
    if (sceneAsset) {
      setImageWithFallback(bgImg, sceneAsset.image, sceneAsset.placeholder);
      bgImg.style.display = '';
    } else {
      bgImg.style.display = 'none';
    }
  }

  // NPC cards
  renderNPCCards(s.npcs || []);
  renderStageCharacters(s.npcs || [], s.current_location || null);

  // timeline
  renderTimeline(s.progress || {}, s.phase);

  // actions
  if (s.available_actions) renderActions(s.available_actions);
}

function renderEvidence(details) {
  const container = document.getElementById('ev-container');
  if (!details || details.length === 0) {
    container.innerHTML = '<div class="ev-empty">尚未获得证据。<br>移动到关键地点或盘问相关人物，可能发现新的线索。</div>';
    return;
  }
  container.innerHTML = '<div class="evidence-cards">' + details.map(ev => {
    const evAsset = resolveEvidenceAsset(ev.name);
    let iconContent = ev.icon || '🔍';
    if (evAsset?.icon || evAsset?.placeholder) {
      iconContent = `<img class="ev-icon-img" alt="${ev.name}"/>`;
    }
    return `
    <div class="ev-card">
      <div class="ev-icon">${iconContent}</div>
      <div class="ev-info">
        <div class="ev-name">${ev.name}</div>
        <div class="ev-meta">来源: ${ev.source} · 指向: ${ev.points_to}</div>
      </div>
      <div class="ev-level ${ev.level==='关键'?'critical':ev.level==='重要'?'important':'normal'}">${ev.level}</div>
    </div>`;
  }).join('') + '</div>';

  // Load evidence icons via manifest
  if (assetManifest) {
    details.forEach(ev => {
      const evAsset = resolveEvidenceAsset(ev.name);
      if (evAsset) {
        const cards = container.querySelectorAll('.ev-card');
        const idx = details.indexOf(ev);
        if (cards[idx]) {
          const img = cards[idx].querySelector('.ev-icon-img');
          if (img) {
            setImageWithFallback(img, evAsset.icon, evAsset.placeholder);
          }
        }
      }
    });
  }
}

function renderNPCCards(npcs) {
  const container = document.getElementById('npc-list');
  container.innerHTML = '';
  for (const npc of npcs) {
    const meta = NPC[npc.name] || {};
    const susp = npc.suspicion_of_player || 0;
    const suspColor = susp > 60 ? 'var(--danger)' : susp > 30 ? 'var(--gold)' : 'var(--narrator)';
    const charAsset = resolveCharacterAsset(npc.name);
    const avatarColor = charAsset?.color || meta.color || 'var(--muted)';
    const avatarLetter = charAsset?.letter || meta.letter || npc.name[0];

    const card = document.createElement('div');
    card.className = 'npc-card' +
      (npc.present ? ' here' : ' absent') +
      (npc.talked ? ' talked' : '');

    // Build avatar: try portrait image first, fallback to letter avatar
    let avatarContent;
    let portraitImg = null;
    if (charAsset?.portrait) {
      portraitImg = document.createElement('img');
      portraitImg.alt = npc.name;
      const ph = charAsset.placeholder;
      setImageWithFallback(portraitImg, charAsset.portrait, ph);
      avatarContent = '';
    } else {
      avatarContent = avatarLetter;
    }

    card.innerHTML = `
      <div class="npc-top">
        <div class="npc-avatar" style="background:${avatarColor}18;color:${avatarColor};border-color:${avatarColor}44">
          ${avatarContent}
        </div>
        <div class="npc-info">
          <div class="npc-name">${npc.name}</div>
          <div class="npc-role">${meta.role || npc.public_role || ''}</div>
          <div class="npc-badges">
            ${npc.present ? '<span class="badge-here">在场</span>' : ''}
            ${npc.talked ? '<span class="badge-talked">已对话</span>' : ''}
            ${!npc.alive ? '<span class="badge-dead">已死亡</span>' : ''}
          </div>
        </div>
      </div>
      ${!npc.present ? `<div class="npc-absent-loc">在 ${npc.location}</div>` : ''}
      ${npc.present && npc.alive ? `<button class="npc-talk-btn" onclick="openTalk('${npc.name}')">盘 问</button>` : ''}
      ${susp > 0 ? `<div class="npc-suspicion">
        <div class="suspicion-label"><span>对你的警觉</span><span>${susp}</span></div>
        <div class="suspicion-bar-bg"><div class="suspicion-bar-fill" style="width:${susp}%;background:${suspColor}"></div></div>
      </div>` : ''}`;
    if (portraitImg) {
      const avatarHost = card.querySelector('.npc-avatar');
      if (avatarHost) avatarHost.appendChild(portraitImg);
    }
    container.appendChild(card);
  }
}

function renderStageCharacters(npcs, location) {
  latestNpcs = npcs || [];
  latestLocation = location || null;

  const layer = document.getElementById('stage-character-layer');
  if (!layer) return;
  layer.innerHTML = '';

  const presentNpcs = buildPresentStageNpcs(npcs, location);
  if (!presentNpcs.length) {
    layer.innerHTML = '<div class="stage-empty">当前地点暂无在场角色立绘。<br>移动地点或推进剧情后再查看。</div>';
    currentNpc = null;
    return;
  }

  if (currentNpc && !presentNpcs.some(npc => npc.name === currentNpc)) currentNpc = null;

  presentNpcs.forEach((npc, index) => {
    const meta = NPC[npc.name] || {};
    const charAsset = resolveCharacterAsset(npc.name) || {};
    const slotClass = stageSlotClass(index, presentNpcs.length);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'stage-character ' + slotClass + (currentNpc === npc.name ? ' active' : '');
    button.onclick = () => openTalk(npc.name);
    button.setAttribute('aria-label', '盘问 ' + npc.name);

    const art = mountStageCharacterArt(button, npc, charAsset, meta);
    const label = document.createElement('div');
    label.className = 'stage-character-label';
    label.textContent = npc.name;

    button.appendChild(art);
    button.appendChild(label);
    layer.appendChild(button);
  });
}

function renderTimeline(progress, phase) {
  const clockEl = document.getElementById('tl-clock');
  const maxC = progress.max_clock || 8;
  const curC = progress.clock || 0;
  clockEl.innerHTML = '';
  for (let i = 0; i <= maxC; i++) {
    const dot = document.createElement('div');
    dot.className = 'tl-dot' + (i < curC ? ' passed' : i === curC ? ' current' : '');
    clockEl.appendChild(dot);
  }

  const phases = ['晚宴','调查','对峙'];
  const phaseOrder = ['dinner','investigation','confrontation'];
  const curIdx = phaseOrder.indexOf(phase);
  const phaseTrack = document.getElementById('tl-phases');
  phaseTrack.innerHTML = phases.map((name, i) =>
    `<div class="tl-phase-badge ${i < curIdx ? 'done' : i === curIdx ? 'active' : ''}">${name}</div>`
  ).join('');

  document.getElementById('tl-events').textContent =
    `事件 ${progress.event_count || 0} | 证据 ${progress.evidence_count || 0} | 对话 ${progress.talked_count || 0}/${progress.npc_count || 6}`;
}

function renderActions(actions) {
  const container = document.getElementById('action-groups');
  container.innerHTML = '';
  const talk = actions.filter(a => a.type === 'talk');
  const move = actions.filter(a => a.type === 'move');
  const inv = actions.filter(a => a.type === 'investigate');
  const adv = actions.filter(a => a.type === 'advance');
  const acc = actions.filter(a => a.type === 'accuse');

  function makeGroup(label, items) {
    if (!items.length) return;
    const group = document.createElement('div');
    group.className = 'action-group';
    const lbl = document.createElement('span'); lbl.className = 'action-group-label'; lbl.textContent = label;
    group.appendChild(lbl);
    for (const a of items) {
      const btn = document.createElement('button');
      btn.className = 'action-btn' + (a.enabled ? '' : ' disabled') + (actionLoading ? ' loading' : '');
      btn.textContent = a.label; btn.disabled = !a.enabled || actionLoading;
      if (!a.enabled && a.hint) btn.title = a.hint;
      btn.onclick = () => !actionLoading && doAction(a);
      group.appendChild(btn);
    }
    container.appendChild(group);
  }

  makeGroup('移动', move);
  makeGroup('盘问', talk);
  makeGroup('调查', inv);
  makeGroup('推进', adv);
  if (acc.length) makeGroup('指认', acc);
}

// ── 动作执行 ────────────────────────────────────
async function doAction(a) {
  if (gameEnded || actionLoading) { if (gameEnded) restartGame(); return; }
  if (a.type === 'talk') return;
  await executeAction(a.type, a.target, null);
}

async function executeAction(type, target, text) {
  actionLoading = true;
  if (type !== 'advance') renderActions(document.querySelectorAll('.action-btn')); // optimistic disable
  try {
    const r = await fetch('/api/action', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sessionId, type, target, text})
    });
    const d = await r.json();
    if (d.state) updateState(d.state);
  } catch(e) { log('entry-system', '发送失败: ' + e.message); }
  actionLoading = false;
}

// ── TALK MODAL ─────────────────────────────────
function openTalk(npcName) {
  if (gameEnded) return;
  currentNpc = npcName;
  renderStageCharacters(latestNpcs, latestLocation);
  const meta = NPC[npcName] || {};
  const charAsset = resolveCharacterAsset(npcName);
  const ov = document.getElementById('talk-overlay');
  const av = document.getElementById('talk-avatar');
  const color = charAsset?.color || meta.color || 'var(--muted)';
  const letter = charAsset?.letter || meta.letter || npcName[0];

  // Try to show portrait image, fall back to letter avatar
  const portrait = charAsset?.portrait;
  const ph = charAsset?.placeholder;
  av.innerHTML = '';
  if (portrait) {
    const img = document.createElement('img');
    img.alt = npcName;
    setImageWithFallback(img, portrait, ph);
    av.appendChild(img);
    av.style.background = color + '18';
    av.style.color = color;
    av.style.borderColor = color + '44';
  } else {
    av.textContent = letter;
    av.style.background = color + '18';
    av.style.color = color;
    av.style.borderColor = color + '44';
  }

  document.getElementById('talk-title').textContent = '盘问 ' + npcName;
  document.getElementById('talk-role').textContent = meta.role || '';

  const pl = document.getElementById('preset-list');
  pl.innerHTML = '';
  (PRESETS[npcName] || []).forEach(q => {
    const b = document.createElement('button'); b.className = 'preset-btn';
    b.textContent = q; b.onclick = () => { document.getElementById('talk-input').value = q; };
    pl.appendChild(b);
  });
  document.getElementById('talk-input').value = '';
  ov.classList.add('show');
  document.getElementById('talk-input').focus();
}

function closeTalk(clearSelection = true) {
  document.getElementById('talk-overlay').classList.remove('show');
  if (clearSelection) currentNpc = null;
  renderStageCharacters(latestNpcs, latestLocation);
}

document.getElementById('talk-send').onclick = () => {
  const text = document.getElementById('talk-input').value.trim();
  if (!text) return;
  const npcName = currentNpc;
  closeTalk(false);
  if (npcName) executeAction('talk', npcName, text);
  currentNpc = null;
  renderStageCharacters(latestNpcs, latestLocation);
};

document.getElementById('talk-cancel').onclick = closeTalk;
document.getElementById('talk-input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('talk-send').click(); }
};

function scroll() {
  const p = document.getElementById('story-log');
  p.scrollTop = p.scrollHeight;
}
</script>
