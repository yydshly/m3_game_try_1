<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孤岛晚宴</title>
<style>
:root {
  --bg: #080c14;
  --surface: #0f1520;
  --surface2: #161e2e;
  --surface3: #1c2638;
  --border: #1e2d42;
  --border2: #2a3a52;
  --gold: #c9a227;
  --gold-dim: #7a6115;
  --gold-glow: rgba(201,162,39,0.15);
  --text: #d4dce8;
  --muted: #5a6a7e;
  --narrator: #5da4c4;
  --system: #8b6fdb;
  --danger: #d94040;
  --success: #3da84f;
  --danger-dim: rgba(217,64,64,0.12);

  /* NPC colors */
  --chenbo: #e3b341;
  --linwan: #d84141;
  --susu: #db61a2;
  --wangzong: #79c0ff;
  --afu: #3da84f;
  --xiaozhang: #ffa657;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── HEADER ─────────────────────────────────── */
header {
  background: linear-gradient(180deg, rgba(15,21,32,0.98) 0%, rgba(15,21,32,0.85) 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 20;
  flex-shrink: 0;
}

.header-title {
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 6px;
  font-weight: 400;
  text-shadow: 0 0 20px rgba(201,162,39,0.3);
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hm-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--muted);
}

.hm-label { color: var(--muted); font-size: 10px; letter-spacing: 1px; }
.hm-value { color: var(--text); font-weight: 500; }

.phase-badge {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 3px 10px;
  color: var(--gold);
  font-size: 10.5px;
  letter-spacing: 1.5px;
}

.conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.conn-dot.live { background: var(--success); box-shadow: 0 0 6px var(--success); }

/* ─── MAIN LAYOUT ──────────────────────────────── */
.game-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ─── LEFT: SCENE STAGE ──────────────────────── */
.scene-stage {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.scene-location-card {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(201,162,39,0.06) 0%, transparent 60%);
}

.location-name {
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.location-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
  font-style: italic;
}

.scene-divider {
  padding: 8px 16px;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 2px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--border);
}

.npc-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.npc-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  transition: all 0.2s;
  cursor: default;
}

.npc-card.here {
  border-color: rgba(201,162,39,0.4);
  background: rgba(201,162,39,0.06);
}

.npc-card.talked {
  border-color: rgba(93,164,196,0.3);
}

.npc-card-absent {
  opacity: 0.45;
}

.npc-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.npc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
  border: 1px solid;
}

.npc-info { flex: 1; min-width: 0; }
.npc-name { font-size: 12.5px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npc-role { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npc-status { font-size: 9.5px; margin-top: 2px; }
.npc-here-badge {
  font-size: 9px;
  background: rgba(201,162,39,0.15);
  color: var(--gold);
  border: 1px solid rgba(201,162,39,0.3);
  border-radius: 4px;
  padding: 1px 5px;
  letter-spacing: 0.5px;
}
.npc-talked-badge {
  font-size: 9px;
  background: rgba(93,164,196,0.1);
  color: var(--narrator);
  border: 1px solid rgba(93,164,196,0.25);
  border-radius: 4px;
  padding: 1px 5px;
}
.npc-absent-label {
  font-size: 9.5px;
  color: var(--muted);
  opacity: 0.6;
}

.npc-talk-btn {
  width: 100%;
  margin-top: 7px;
  background: rgba(201,162,39,0.08);
  border: 1px solid rgba(201,162,39,0.25);
  border-radius: 5px;
  color: var(--gold);
  font-size: 11px;
  padding: 5px 8px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.5px;
  transition: all 0.15s;
}
.npc-talk-btn:hover { background: rgba(201,162,39,0.16); border-color: var(--gold); }
.npc-talk-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ─── CENTER: STORY LOG ──────────────────────── */
.story-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.story-log {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 80px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* entry types */
.entry-narrator {
  margin: 10px 0;
  padding: 10px 14px 10px 16px;
  color: var(--narrator);
  font-size: 12.5px;
  line-height: 1.9;
  border-left: 2px solid rgba(93,164,196,0.45);
  background: rgba(93,164,196,0.05);
  border-radius: 0 6px 6px 0;
  font-style: italic;
}

.entry-system {
  color: var(--system);
  font-size: 11.5px;
  padding: 4px 2px;
  opacity: 0.8;
  border-left: 2px solid rgba(139,111,219,0.3);
  padding-left: 10px;
  margin: 4px 0;
}

.entry-investigate {
  background: rgba(93,164,196,0.07);
  border: 1px solid rgba(93,164,196,0.2);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--narrator);
  margin: 4px 0;
}

.entry-clock {
  text-align: center;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 2px;
  padding: 6px 0;
  opacity: 0.7;
}

.entry-gameover {
  background: rgba(201,162,39,0.08);
  border: 1px solid rgba(201,162,39,0.3);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  margin: 8px 0;
}

.entry-gameover .go-verdict {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.entry-gameover .go-summary {
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.8;
  text-align: left;
  white-space: pre-wrap;
}

/* dialogue */
.entry-dialogue {
  display: flex;
  gap: 10px;
  margin: 6px 0;
  align-items: flex-start;
}
.entry-dialogue.player { flex-direction: row-reverse; }

.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
  flex-shrink: 0;
  border: 1px solid;
}

.bubble {
  max-width: 65%;
  padding: 9px 13px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.7;
}
.entry-dialogue:not(.player) .bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 2px 12px 12px 12px;
}
.entry-dialogue.player .bubble {
  background: rgba(201,162,39,0.1);
  border: 1px solid rgba(201,162,39,0.2);
  border-radius: 12px 2px 12px 12px;
  color: var(--text);
}
.speaker-name {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 3px;
  letter-spacing: 1px;
}
.player-label { color: var(--gold) !important; }

.typing-cursor {
  display: inline-block;
  width: 2px; height: 13px;
  background: var(--gold);
  vertical-align: middle;
  animation: blink 0.7s step-end infinite;
  margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ─── RIGHT SIDEBAR ─────────────────────────── */
.right-sidebar {
  width: 250px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.sidebar-title {
  padding: 8px 14px;
  background: rgba(201,162,39,0.06);
  color: var(--gold);
  font-size: 9.5px;
  letter-spacing: 2px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-body {
  padding: 10px 14px;
  flex: 1;
  overflow-y: auto;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  padding: 3px 0;
}
.stat-label { color: var(--muted); }
.stat-value { color: var(--text); font-weight: 500; }

.evidence-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.etag {
  background: rgba(93,164,196,0.1);
  border: 1px solid rgba(93,164,196,0.25);
  color: var(--narrator);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
}
.etag-empty { color: var(--muted); font-size: 11px; font-style: italic; }

.event-item {
  font-size: 11px;
  color: var(--muted);
  padding: 3px 0;
  border-bottom: 1px solid rgba(30,45,66,0.6);
  line-height: 1.5;
}
.event-item:last-child { border-bottom: none; }

/* ─── ACTION BAR ─────────────────────────────── */
.action-bar {
  background: linear-gradient(0deg, rgba(15,21,32,0.98) 0%, rgba(15,21,32,0.9) 100%);
  border-top: 1px solid var(--border);
  padding: 10px 20px 12px;
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}

.action-groups {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.action-group {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.action-group-label {
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 1.5px;
  margin-right: 3px;
  white-space: nowrap;
  min-width: 32px;
}

.action-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 13px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.action-btn:hover:not(:disabled) {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(201,162,39,0.08);
  box-shadow: 0 0 8px rgba(201,162,39,0.1);
}
.action-btn:disabled, .action-btn.disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* ─── TALK MODAL ─────────────────────────────── */
#talk-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8,12,20,0.85);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#talk-overlay.show { display: flex; }
.talk-card {
  background: var(--surface);
  border: 1px solid rgba(201,162,39,0.3);
  border-radius: 10px;
  padding: 28px 32px;
  width: 400px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(201,162,39,0.05);
}
.talk-npc-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  margin: 0 auto 10px;
  border: 1px solid;
}
.talk-title {
  text-align: center;
  color: var(--gold);
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.talk-role {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 16px;
}
.preset-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.preset-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.preset-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
#talk-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12.5px;
  padding: 9px 12px;
  font-family: inherit;
  outline: none;
  resize: none;
  box-sizing: border-box;
  line-height: 1.6;
}
#talk-input:focus { border-color: var(--gold-dim); }
.talk-btns { display: flex; gap: 8px; margin-top: 12px; }
.talk-btns button { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: bold; letter-spacing: 1px; transition: background 0.2s; }
#talk-send { background: var(--gold-dim); color: var(--bg); }
#talk-send:hover { background: var(--gold); }
#talk-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
#talk-cancel:hover { border-color: var(--muted); color: var(--text); }

/* ─── ONBOARDING ─────────────────────────────── */
#onboarding {
  position: fixed;
  inset: 0;
  background: rgba(8,12,20,0.96);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
#onboarding .card {
  background: var(--surface);
  border: 1px solid rgba(201,162,39,0.25);
  border-radius: 12px;
  padding: 40px 48px;
  max-width: 460px;
  text-align: center;
  box-shadow: 0 0 80px rgba(201,162,39,0.06);
}
#onboarding h2 {
  color: var(--gold);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 8px;
  margin-bottom: 18px;
  text-shadow: 0 0 30px rgba(201,162,39,0.2);
}
#onboarding p {
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.9;
  margin-bottom: 24px;
}
#onboarding .hint {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  text-align: left;
  margin-bottom: 24px;
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
}
#onboarding .hint span { color: var(--gold); font-family: monospace; }
#onboarding button {
  background: var(--gold-dim);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  padding: 11px 36px;
  font-size: 13.5px;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  letter-spacing: 3px;
  transition: background 0.2s;
}
#onboarding button:hover { background: var(--gold); }

/* ─── GAME OVER ──────────────────────────────── */
#gameover {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8,12,20,0.92);
  align-items: center;
  justify-content: center;
  z-index: 300;
}
#gameover.show { display: flex; }
#gameover .card {
  background: var(--surface);
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  padding: 40px;
  max-width: 520px;
  width: 90%;
  text-align: center;
  box-shadow: 0 0 60px rgba(201,162,39,0.08);
}
#gameover h2 {
  color: var(--gold);
  font-size: 18px;
  letter-spacing: 4px;
  margin-bottom: 12px;
}
#gameover .verdict {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 20px;
}
#gameover .summary {
  color: var(--text);
  font-size: 13px;
  line-height: 1.9;
  margin-bottom: 24px;
  white-space: pre-wrap;
  text-align: left;
}
#gameover button {
  background: var(--gold-dim);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  padding: 10px 32px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  letter-spacing: 2px;
  transition: background 0.2s;
}
#gameover button:hover { background: var(--gold); }

/* ─── SCENE FLASH ─────────────────────────────── */
#scene-flash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s;
}
#scene-flash.active { opacity: 1; pointer-events: all; }
#scene-flash .flash-text {
  color: var(--gold);
  font-size: 15px;
  letter-spacing: 4px;
  opacity: 0;
  transition: opacity 0.3s 0.15s;
}
#scene-flash.active .flash-text { opacity: 1; }
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding">
  <div class="card">
    <h2>孤岛晚宴</h2>
    <p>暴风雨困住了所有人。今晨，岛主周慎之被发现死在书房。<br>你是被请来的私人侦探，天亮之前，找出真凶。</p>
    <div class="hint">
      点击右侧<span>行动按钮</span>推进游戏<br>
      点击<span>人物卡</span>开始盘问<br>
      收集证据，追踪线索，在<span>对峙阶段</span>指认真凶
    </div>
    <button onclick="startGame()">开始调查</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover">
  <div class="card">
    <h2 id="go-title">结局</h2>
    <div class="verdict" id="go-verdict"></div>
    <div class="summary" id="go-summary"></div>
    <button onclick="restartGame()">再来一局</button>
  </div>
</div>

<!-- SCENE FLASH -->
<div id="scene-flash">
  <div class="flash-text" id="flash-text"></div>
</div>

<!-- TALK MODAL -->
<div id="talk-overlay">
  <div class="talk-card">
    <div class="talk-npc-avatar" id="talk-avatar"></div>
    <div class="talk-title" id="talk-title">盘问</div>
    <div class="talk-role" id="talk-role"></div>
    <div class="preset-list" id="preset-list"></div>
    <textarea id="talk-input" rows="3" placeholder="输入你想问的话……"></textarea>
    <div class="talk-btns">
      <button id="talk-cancel">取消</button>
      <button id="talk-send">发问</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-title">孤 岛 晚 宴</div>
  <div class="header-meta">
    <div class="hm-item"><span class="hm-label">时段</span><span class="hm-value" id="h-clock">—</span></div>
    <div class="phase-badge" id="h-phase">—</div>
    <div class="hm-item"><span class="hm-label">地点</span><span class="hm-value" id="h-location">—</span></div>
    <div class="hm-item"><span class="hm-label">证据</span><span class="hm-value" id="h-evcount">0</span></div>
    <div class="hm-item"><span class="hm-label">对话</span><span class="hm-value" id="h-talked">0</span></div>
    <div class="conn-dot" id="connDot"></div>
  </div>
</header>

<!-- MAIN LAYOUT -->
<div class="game-layout">

  <!-- LEFT: SCENE STAGE -->
  <div class="scene-stage">
    <div class="scene-location-card">
      <div class="location-name" id="sc-location">—</div>
      <div class="location-desc" id="sc-desc">—</div>
    </div>
    <div class="scene-divider">在 场 人 物</div>
    <div class="npc-list" id="npc-list">
      <!-- NPC cards rendered by JS -->
    </div>
  </div>

  <!-- CENTER: STORY LOG -->
  <div class="story-panel">
    <div class="story-log" id="story-log"></div>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div class="right-sidebar">
    <div class="sidebar-section" style="flex-shrink:0">
      <div class="sidebar-title">当前状态</div>
      <div class="sidebar-body">
        <div class="stat-row"><span class="stat-label">时段</span><span class="stat-value" id="s-clock">—</span></div>
        <div class="stat-row"><span class="stat-label">阶段</span><span class="stat-value" id="s-phase">—</span></div>
        <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value" id="s-location">—</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">持有证据</div>
      <div class="sidebar-body">
        <div class="evidence-tags" id="s-evidence">
          <span class="etag-empty">尚未获得证据</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1;overflow:hidden">
      <div class="sidebar-title">公共事件</div>
      <div class="sidebar-body" id="s-events">
        <span class="etag-empty">暂无公共事件</span>
      </div>
    </div>
  </div>
</div>

<!-- ACTION BAR -->
<div class="action-bar">
  <div class="action-groups" id="action-groups"></div>
</div>

<script>
// ─── NPC 基础数据 ─────────────────────────────────────
const NPC_META = {
  '陈伯':  { cls:'chenbo',   color:'var(--chenbo)',   letter:'伯', role:'老管家' },
  '林婉':  { cls:'linwan',   color:'var(--linwan)',   letter:'婉', role:'私人医生' },
  '苏苏':  { cls:'susu',     color:'var(--susu)',     letter:'苏', role:'侄女' },
  '王总':  { cls:'wangzong', color:'var(--wangzong)', letter:'王', role:'商业伙伴' },
  '阿福':  { cls:'afu',      color:'var(--afu)',      letter:'福', role:'厨师' },
  '小张':  { cls:'xiaozhang',color:'var(--xiaozhang)',letter:'张', role:'保安' },
};

const PRESETS = {
  '陈伯': ['你昨晚在哪？','茶杯的事你知道吗？','新遗嘱是怎么回事？','周老爷有什么仇家吗？'],
  '林婉': ['你和周老爷是什么关系？','你给他开了什么药？','你昨晚几点睡的？','你知道新遗嘱的事吗？'],
  '苏苏': ['你为什么来岛上？','你和周老爷吵过架吗？','昨晚你听到了什么？','你知道遗产的事吗？'],
  '王总': ['你欠周老爷多少钱？','借据在哪？','你昨晚去了哪里？','你和林婉什么关系？'],
  '阿福': ['你昨晚看到了什么？','有人进过书房吗？','厨房有什么异常吗？','你知道谁下的毒吗？'],
  '小张': ['你昨晚巡逻了吗？','监控为什么有空白？','有人进出过书房吗？','你听到了什么动静？'],
};

const PHASE_NAME = {
  dinner:'晚宴', investigation:'调查', confrontation:'对峙', ending:'结局'
};

// ─── 状态 ────────────────────────────────────────────
let sessionId = null;
let es = null;
let gameEnded = false;
let currentNpc = null; // for talk modal

// ─── 初始化 ──────────────────────────────────────────
function startGame() {
  document.getElementById('onboarding').style.display = 'none';
  initGame();
}

async function initGame() {
  try {
    const r = await fetch('/api/session', {method:'POST'});
    const d = await r.json();
    sessionId = d.session_id;
    updateState(d.state);
    connectSSE(sessionId);
    document.getElementById('connDot').classList.add('live');
  } catch(e) {
    log('system', '连接服务器失败: ' + e.message);
  }
}

// ─── SSE ─────────────────────────────────────────────
function connectSSE(sid) {
  if (es) es.close();
  es = new EventSource(`/api/stream/${sid}`);
  es.addEventListener('connected', () => {
    document.getElementById('connDot').classList.add('live');
  });
  es.addEventListener('narrator', e => streamNarrator(JSON.parse(e.data)));
  es.addEventListener('npc_reply', e => streamNPCReply(JSON.parse(e.data)));
  es.addEventListener('system', e => handleSystem(JSON.parse(e.data)));
  es.addEventListener('game_over', e => showGameOver(JSON.parse(e.data)));
  es.addEventListener('heartbeat', () => {});
  es.onerror = () => {
    document.getElementById('connDot').classList.remove('live');
  };
}

// ─── 渲染 ─────────────────────────────────────────────
function streamNarrator(chunks) {
  const el = document.createElement('div');
  el.className = 'entry-narrator';
  document.getElementById('story-log').appendChild(el);
  streamText(el, chunks);
}

function streamNPCReply(data) {
  const npc = data.npc;
  const meta = NPC_META[npc] || {};
  const w = document.createElement('div');
  w.className = 'entry-dialogue';
  w.innerHTML = `
    <div class="avatar" style="background:${meta.color}22;color:${meta.color};border-color:${meta.color}55">
      ${meta.letter || npc[0]}
    </div>
    <div class="bubble">
      <div class="speaker-name">${npc}</div>
    </div>`;
  document.getElementById('story-log').appendChild(w);
  const bubble = w.querySelector('.bubble');
  streamText(bubble, data.text);
  scroll();
}

function streamText(el, chunks) {
  let i = 0;
  const cur = document.createElement('span');
  cur.className = 'typing-cursor';
  el.appendChild(cur);
  function next() {
    if (i < chunks.length) {
      el.insertBefore(document.createTextNode(chunks[i]), cur);
      i++; scroll();
      setTimeout(next, 55 + Math.random() * 50);
    } else {
      cur.remove();
    }
  }
  next();
}

function handleSystem(data) {
  if (data.type === 'game_over') { showGameOver(data); return; }
  if (data.type === 'clock') {
    log('entry-clock', '─── ' + data.text + ' ───');
    return;
  }
  if (data.type === 'location') {
    showFlash(data.text.split('\n')[0]);
    return;
  }
  const cls = ['phase-hint','npc_action','npc_decision','linwan_alert','accusation','boat_arrived'].includes(data.type)
    ? 'entry-system phase-hint' : 'entry-system';
  log(cls, data.text || JSON.stringify(data));
}

function log(cls, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  document.getElementById('story-log').appendChild(el);
  scroll();
}

function showFlash(text) {
  const flash = document.getElementById('scene-flash');
  document.getElementById('flash-text').textContent = text;
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 1200);
}

function showGameOver(d) {
  document.getElementById('go-verdict').textContent = d.verdict || '';
  const full = (d.summary || '') + '\n\n真凶: ' + (d.culprit || '?') +
    (d.innocent && d.innocent.length ? '\n无辜: ' + d.innocent.join('、') : '');
  document.getElementById('go-summary').textContent = '';
  document.getElementById('gameover').classList.add('show');
  gameEnded = true;
  const el = document.getElementById('go-summary');
  streamText(el, [full]);
}

function restartGame() {
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('story-log').innerHTML = '';
  gameEnded = false;
  if (es) { es.close(); es = null; }
  initGame();
}

// ─── 状态同步 ─────────────────────────────────────────
function updateState(s) {
  if (!s) return;

  // header
  document.getElementById('h-clock').textContent = s.clock_name || '—';
  document.getElementById('h-phase').textContent = PHASE_NAME[s.phase] || s.phase || '—';
  document.getElementById('h-location').textContent = s.player_location || '—';
  document.getElementById('h-evcount').textContent = (s.inventory || []).length;
  document.getElementById('h-talked').textContent = (s.talked_npcs || []).length;

  // sidebar
  document.getElementById('s-clock').textContent = s.clock_name || '—';
  document.getElementById('s-phase').textContent = PHASE_NAME[s.phase] || s.phase || '—';
  document.getElementById('s-location').textContent = s.player_location || '—';

  // evidence
  const inv = s.inventory || [];
  document.getElementById('s-evidence').innerHTML = inv.length
    ? inv.map(e => `<span class="etag">${e}</span>`).join('')
    : '<span class="etag-empty">尚未获得证据</span>';

  // public events
  const evts = s.public_events || [];
  document.getElementById('s-events').innerHTML = evts.length
    ? evts.map(e => `<div class="event-item">${e}</div>`).join('')
    : '<span class="etag-empty">暂无公共事件</span>';

  // scene stage: location
  document.getElementById('sc-location').textContent = s.player_location || '—';
  document.getElementById('sc-desc').textContent = _locationDesc(s.player_location);

  // NPC cards
  renderNPCCards(s);

  // action buttons
  if (s.available_actions) {
    renderActions(s.available_actions);
  }
}

function _locationDesc(loc) {
  const descs = {
    '大厅':'古堡大厅，水晶吊灯昏黄，窗外暴风雨呼啸。',
    '书房':'书架林立，书桌上散落文件和钢笔，空气中有淡淡药味。',
    '厨房':'灶台有余温，阿福独自坐在角落，神情不安。',
    '餐厅':'长餐桌上菜肴半食，酒杯东倒西歪，似匆忙离席。',
    '保安室':'监控室，几块屏幕闪烁，小张独自守夜。',
    '走廊':'长走廊，墙上挂着人物油画，脚步声在空旷中回响。',
    '陈伯房间':'简朴整洁，床头放着褪色的老照片。',
    '苏苏房间':'化妆台堆满化妆品，角落有未寄出的信封。',
    '林婉房间':'医学书籍堆在桌上，消毒水气味。',
    '王总房间':'行李箱敞开，满是商业文件。',
    '自己房间':'临时客房，窗外海浪拍岸。',
  };
  return descs[loc] || '昏暗不明。';
}

function renderNPCCards(s) {
  const container = document.getElementById('npc-list');
  container.innerHTML = '';
  const locs = s.npc_locations || {};
  const talked = s.talked_npcs || [];
  const playerLoc = s.player_location;

  for (const [name, npcLoc] of Object.entries(locs)) {
    const meta = NPC_META[name] || { cls:'', color:'var(--muted)', letter:name[0], role:'' };
    const isHere = npcLoc === playerLoc;
    const isTalked = talked.includes(name);

    const card = document.createElement('div');
    card.className = 'npc-card' + (isHere ? ' here' : '') + (isTalked ? ' talked' : '') + (!isHere ? ' npc-card-absent' : '');

    card.innerHTML = `
      <div class="npc-top">
        <div class="npc-avatar" style="background:${meta.color}18;color:${meta.color};border-color:${meta.color}44">
          ${meta.letter}
        </div>
        <div class="npc-info">
          <div class="npc-name">${name}</div>
          <div class="npc-role">${meta.role}</div>
          <div class="npc-status">
            ${isHere ? '<span class="npc-here-badge">在场</span>' : ''}
            ${isTalked ? '<span class="npc-talked-badge">已对话</span>' : ''}
          </div>
        </div>
      </div>
      ${!isHere ? `<div class="npc-absent-label">在 ${npcLoc}</div>` : ''}
      ${isHere ? `<button class="npc-talk-btn" onclick="openTalk('${name}')">盘 问</button>` : ''}`;

    container.appendChild(card);
  }
}

function renderActions(actions) {
  const container = document.getElementById('action-groups');
  container.innerHTML = '';

  const talk = actions.filter(a => a.type === 'talk');
  const move = actions.filter(a => a.type === 'move');
  const other = actions.filter(a => !['talk','move'].includes(a.type));

  function makeGroup(label, items) {
    if (!items.length) return;
    const group = document.createElement('div');
    group.className = 'action-group';
    const lbl = document.createElement('span');
    lbl.className = 'action-group-label';
    lbl.textContent = label;
    group.appendChild(lbl);
    for (const a of items) {
      const btn = document.createElement('button');
      btn.className = 'action-btn' + (a.enabled ? '' : ' disabled');
      btn.textContent = a.label;
      btn.disabled = !a.enabled;
      if (!a.enabled && a.hint) btn.title = a.hint;
      btn.onclick = () => doAction(a);
      group.appendChild(btn);
    }
    container.appendChild(group);
  }

  makeGroup('移动', move);
  makeGroup('调查', other.filter(a => a.type === 'investigate'));
  makeGroup('推进', other.filter(a => a.type === 'advance'));
  if (other.filter(a => a.type === 'accuse').length) {
    makeGroup('指认', other.filter(a => a.type === 'accuse'));
  }
}

// ─── 动作执行 ─────────────────────────────────────────
async function doAction(a) {
  if (gameEnded) { restartGame(); return; }
  if (a.type === 'talk') return; // handled by openTalk
  await executeAction(a.type, a.target, null);
}

async function executeAction(type, target, text) {
  try {
    const r = await fetch('/api/action', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sessionId, type, target, text})
    });
    const d = await r.json();
    if (d.state) updateState(d.state);
  } catch(e) {
    log('entry-system', '发送失败: ' + e.message);
  }
}

// ─── TALK MODAL ───────────────────────────────────────
function openTalk(npcName) {
  if (gameEnded) return;
  currentNpc = npcName;
  const meta = NPC_META[npcName] || {};
  const overlay = document.getElementById('talk-overlay');

  document.getElementById('talk-avatar').textContent = meta.letter || npcName[0];
  document.getElementById('talk-avatar').style.background = (meta.color || 'var(--muted)') + '18';
  document.getElementById('talk-avatar').style.color = meta.color || 'var(--muted)';
  document.getElementById('talk-avatar').style.borderColor = (meta.color || 'var(--muted)') + '44';
  document.getElementById('talk-title').textContent = '盘问 ' + npcName;
  document.getElementById('talk-role').textContent = meta.role || '';

  const presets = document.getElementById('preset-list');
  presets.innerHTML = '';
  (PRESETS[npcName] || []).forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = q;
    btn.onclick = () => { document.getElementById('talk-input').value = q; };
    presets.appendChild(btn);
  });

  document.getElementById('talk-input').value = '';
  overlay.classList.add('show');
  document.getElementById('talk-input').focus();
}

function closeTalk() {
  document.getElementById('talk-overlay').classList.remove('show');
  currentNpc = null;
}

document.getElementById('talk-send').onclick = () => {
  const text = document.getElementById('talk-input').value.trim();
  if (!text) return;
  closeTalk();
  if (!currentNpc) return;
  executeAction('talk', currentNpc, text);
};

document.getElementById('talk-cancel').onclick = closeTalk;

document.getElementById('talk-input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('talk-send').click(); }
};

function scroll() {
  const p = document.getElementById('story-log');
  p.scrollTop = p.scrollHeight;
}
</script>
</body>
</html>
